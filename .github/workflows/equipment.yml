name: Approve equipment request
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  register:
    if: github.event.label.name == 'approved-equipment' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/approve-equipment.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
